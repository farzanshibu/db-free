[package]
name = "db-free"
version = "0.11.0"
description = "Lightweight native database workbench"
license = "MIT"
authors = ["Farzan"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "db_free_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Self-update: checks the signed latest.json published with each GitHub release.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["compat"] }
# --- vendor adapters: each crate below is imported in exactly one layer ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
# aws-auth: MONGODB-AWS; azure-oidc / gcp-oidc: MONGODB-OIDC workload identity (Atlas sign-in methods).
mongodb = { version = "3", features = ["compat-3-3-0", "bson-3", "aws-auth", "azure-oidc", "gcp-oidc"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
scylla = { version = "1", features = ["rustls-023", "chrono-04"] }
neo4rs = "0.8"
rskafka = { version = "0.6", features = ["transport-tls"] }
# TLS client configs for the scylla / rskafka transports (both take an Arc<rustls::ClientConfig>).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
duckdb = { version = "1.4", features = ["bundled"] }
rocksdb = { version = "0.24", default-features = false, features = ["bindgen-runtime", "lz4", "zstd", "snappy"] }
oracle = "0.6"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
csv = "1"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
# SSH tunnels for server-form connections. Pure Rust, `ring` backend so it builds
# on Windows MSVC without extra system deps. Imported only in integrations/ssh_tunnel.rs.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
# Agent framework: one CompletionModel abstraction over Anthropic / OpenAI /
# OpenRouter / Ollama, with unified message + tool-call types and streaming that
# accumulates fragmented tool arguments. The run loop, tool dispatch and the
# permission gate stay ours (src-tauri/src/services/agent/).
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls", "derive"] }

# Workflows: regex node, IANA time zones for schedules, SMTP email node (rustls), JavaScript sandbox (QuickJS,
# no host APIs), desktop notifications. The notification plugin is pinned: 2.5+ needs tauri 2.12, the lockfile has 2.11.
regex = "1"
chrono-tz = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
rquickjs = "0.14"
tauri-plugin-notification = "=2.4.0"
# Multi-table export as a ZIP of per-table files (services/export.rs only). Deflate
# only: the same feature set libduckdb-sys already builds zip 6 with.
zip = { version = "6", default-features = false, features = ["deflate"] }
# Navicat `.ncx` import (XML, entity expansion off). Imported only in services/connection_formats.rs.
quick-xml = "0.41"
# Forwards a second launch ("Open with" a .sqlite file on Windows / Linux) to the running instance.
# Pinned: later releases need a newer tauri than Cargo.lock holds.
tauri-plugin-single-instance = "=2.4.5"
# Window geometry (S2) and the rotating log file (S17, replaces env_logger). Both are
# pinned: the 2.5 / 2.10 releases need tauri 2.12 and the lockfile has 2.11.
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-log = "=2.9.2"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
await_holding_lock = "deny"
